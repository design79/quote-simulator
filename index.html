<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>フォトウェディング見積もりシミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   0. デザイントークン（色・書体・余白）
   2026.7.30：参考画像に合わせて全面刷新
   （白背景＋ローズレッドのアクセント＋太字サンセリフ／
   エレガント寄りだった配色・書体をシンプルな方向に変更）
   ここを変えるだけで全体の雰囲気を変えられます
============================================================ */
:root{
  --bg:#F6F5F8;
  --surface:#FFFFFF;
  --surface-muted:#FAF9FB;
  --ink:#1E1B1F;
  --ink-soft:#79737C;
  --line:#E5E1E8;
  --accent:#CC3F5C;       /* ローズレッド：価格・選択状態・強調 */
  --accent-dark:#A93049;
  --accent-soft:#FBEAEE;  /* 選択時などの淡い背景 */
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 6px 20px rgba(20,16,20,.06);
  --font-body:'Noto Sans JP', sans-serif;
  --font-price:'Shippori Mincho', serif; /* 金額の数字だけに使う明朝体 */
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.app{
  max-width:480px;
  margin:0 auto;
  padding:24px 16px 56px;
}
.app__header{
  text-align:center;
  margin-bottom:22px;
}
.app__eyebrow{
  font-size:11px;
  font-weight:700;
  letter-spacing:.25em;
  color:var(--accent);
  margin:0 0 8px;
}
.app__title{
  font-size:22px;
  font-weight:900;
  margin:0 0 6px;
  letter-spacing:.02em;
}
.app__lead{
  font-size:12.5px;
  color:var(--ink-soft);
  margin:0;
}

/* ---- ステップインジケーター（4分割のバー） ---- */
.steps{
  display:flex;
  gap:6px;
  list-style:none;
  padding:0;
  margin:0 0 22px;
}
.steps li{
  flex:1;
  height:6px;
  border-radius:999px;
  background:var(--line);
  transition:background .2s ease;
}
.steps li.is-active,
.steps li.is-done{background:var(--accent);}

/* ---- パネル共通 ---- */
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px 16px;
}
.panel[hidden]{display:none;}
.panel__title{
  font-size:16px;
  font-weight:900;
  margin:0 0 4px;
}
.panel__note{
  font-size:12px;
  color:var(--ink-soft);
  margin:0 0 16px;
}

/* ---- エリア（アコーディオン）／ロケ地 ---- */
.area{
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  margin-bottom:10px;
  overflow:hidden;
}
.area__header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  padding:14px;
  background:var(--surface);
  border:0;
  text-align:left;
  font-size:14px;
  font-weight:700;
  color:var(--ink);
  cursor:pointer;
  font-family:var(--font-body);
}
.area__store{
  display:block;
  font-size:11px;
  font-weight:400;
  color:var(--ink-soft);
  margin-top:2px;
}
.area__header-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.area__header-selected{
  font-size:12.5px;
  font-weight:700;
  color:var(--accent);
  max-width:120px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.area__arrow{
  color:var(--ink-soft);
  transition:transform .2s ease;
  flex-shrink:0;
}
.area.is-open .area__arrow{transform:rotate(180deg);}
.area__body{display:none;padding:0 10px 10px;}
.area.is-open .area__body{display:block;}

.loc-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  width:100%;
  padding:12px;
  margin-top:6px;
  background:var(--surface-muted);
  border:1.5px solid transparent;
  border-radius:var(--radius-sm);
  text-align:left;
  font-family:var(--font-body);
  font-size:13.5px;
  color:var(--ink);
  cursor:pointer;
  transition:.15s ease;
}
.loc-row:hover{border-color:var(--accent);}
.loc-row:focus-visible{outline:2px solid var(--accent-dark);outline-offset:2px;}
.loc-row.is-selected{
  border-color:var(--accent);
  background:var(--accent-soft);
}
.loc-row__badge{
  font-size:11px;
  font-weight:700;
  color:var(--accent);
  white-space:nowrap;
  flex-shrink:0;
}

/* ---- ここまでの合計（進行中の目安金額） ---- */
.subtotal{
  text-align:center;
  font-size:12.5px;
  color:var(--ink-soft);
  margin:16px 0 4px;
}
.subtotal strong{
  font-size:17px;
  font-weight:900;
  color:var(--ink);
  margin-left:4px;
}

/* ---- プランカード ---- */
.plan-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  width:100%;
  padding:15px 14px;
  margin-bottom:10px;
  background:var(--surface);
  border:1.5px solid var(--line);
  border-radius:var(--radius-sm);
  cursor:pointer;
  text-align:left;
  transition:.15s ease;
  font-family:var(--font-body);
}
.plan-card:hover{border-color:var(--accent);}
.plan-card.is-selected{
  border-color:var(--accent);
  background:var(--accent-soft);
}
.plan-card__name{
  font-size:14.5px;
  font-weight:700;
  color:var(--ink);
}
.plan-card__badge{
  display:inline-block;
  margin-left:6px;
  padding:2px 8px;
  border-radius:999px;
  background:var(--accent);
  color:#fff;
  font-size:10px;
  font-weight:700;
  vertical-align:middle;
}
.plan-card__desc{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.plan-card__price{text-align:right;white-space:nowrap;}
.plan-card__price-original{display:block;font-size:11px;color:var(--ink-soft);text-decoration:line-through;}
.plan-card__price-final{font-size:16.5px;font-weight:900;color:var(--accent);}

/* ---- 日付選択 ---- */
.date-field{margin-bottom:4px;}
.date-field input[type="date"]{
  width:100%;
  height:48px;
  box-sizing:border-box;
  padding:0 13px;
  font-size:16px; /* 16px未満だとiOSでタップ時に自動ズームが入るため16pxに */
  line-height:normal;
  font-family:var(--font-body);
  border:1.5px solid var(--line);
  border-radius:var(--radius-sm);
  background:var(--surface);
  color:var(--ink);
}
.date-hint{
  margin-top:10px;
  font-size:12.5px;
  font-weight:700;
  padding:12px;
  border-radius:var(--radius-sm);
  background:var(--accent-soft);
  color:var(--accent-dark);
}
.date-hint[hidden]{display:none;}

/* ---- 共通ボタン ---- */
.btn{
  display:inline-block;
  width:100%;
  padding:14px;
  font-family:var(--font-body);
  font-size:14.5px;
  font-weight:700;
  text-align:center;
  border-radius:999px;
  border:1.5px solid var(--ink);
  background:transparent;
  color:var(--ink);
  cursor:pointer;
  transition:.15s ease;
}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn:not(:disabled):hover{background:var(--ink);color:#fff;}
.btn--primary{
  background:var(--ink);
  border-color:var(--ink);
  color:#fff;
}
.btn--line{
  background:#06C755;
  border-color:#06C755;
  color:#fff;
  font-weight:900;
}
.btn--line:hover{background:#05a848;}
.btn--ghost{border-color:var(--line);color:var(--ink-soft);}
.btn-row{display:flex;gap:10px;margin-top:16px;}
.btn-row .btn{flex:1;}

/* ---- 結果画面 ---- */
.summary{
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:2px 16px;
  margin-bottom:18px;
}
.summary-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:11px 0;
  font-size:13px;
}
.summary-row + .summary-row{border-top:1px dashed var(--line);}
.summary-row__label{color:var(--ink-soft);flex-shrink:0;}
.summary-row__value{font-weight:700;text-align:right;color:var(--ink);}

.price-box{
  text-align:center;
  padding:22px 14px 18px;
  margin-bottom:18px;
  border-radius:var(--radius-sm);
  background:var(--surface-muted);
  border:1px solid var(--line);
}
.price-box__row{font-size:13px;color:var(--ink-soft);}
.price-box__row del{margin-left:4px;}
.price-box__badge{
  display:inline-block;
  margin:12px 0 14px;
  padding:6px 16px;
  border-radius:999px;
  background:var(--accent);
  color:#fff;
  font-family:var(--font-price);
  font-size:14px;
  font-weight:700;
}
.price-box__final{
  font-family:var(--font-price);
  font-size:36px;
  font-weight:700;
  color:var(--accent);
  margin:0;
  line-height:1.2;
  letter-spacing:.02em;
}
.price-box__final small{font-family:var(--font-price);font-size:17px;font-weight:700;color:var(--accent);}
.price-box__taxline{font-family:var(--font-price);font-size:22px;font-weight:700;color:var(--accent);margin:8px 0 14px;line-height:1.2;}
.price-box__tax{font-size:10.5px;color:var(--ink-soft);margin:10px 0 0;}

.savings-box{
  border:1.5px dashed var(--accent);
  border-radius:var(--radius-sm);
  padding:14px 16px;
  text-align:center;
  font-size:12.5px;
  color:var(--accent-dark);
  margin-bottom:18px;
}
.savings-box strong{font-size:15px;}

.reset-link{
  display:block;
  text-align:center;
  margin-top:16px;
  font-size:12px;
  color:var(--ink-soft);
  text-decoration:underline;
  background:none;border:none;cursor:pointer;
}

@media (prefers-reduced-motion: no-preference){
  .panel{animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
}
</style>
</head>
<body>
<div class="app">

  <header class="app__header">
    <p class="app__eyebrow">PHOTO WEDDING SIMULATOR</p>
    <h1 class="app__title">かんたん見積もり</h1>
    <p class="app__lead">ロケ地・プラン・撮影日を選ぶだけで、その場で概算料金が分かります</p>
  </header>

  <ol class="steps" id="stepIndicator">
    <li data-step="1"><span class="visually-hidden">ロケ地</span></li>
    <li data-step="2"><span class="visually-hidden">プラン</span></li>
    <li data-step="3"><span class="visually-hidden">撮影日</span></li>
    <li data-step="4"><span class="visually-hidden">見積り</span></li>
  </ol>

  <main>
    <!-- STEP 1: ロケ地 -->
    <section class="panel" id="panel-1">
      <h2 class="panel__title">撮影したいロケ地を選んでください</h2>
      <p class="panel__note">エリアを開いて選択してください。タップすると自動で次に進みます。</p>
      <div id="locationList"></div>
      <p class="subtotal" id="subtotal-1"></p>
    </section>

    <!-- STEP 2: プラン -->
    <section class="panel" id="panel-2" hidden>
      <h2 class="panel__title">プランを選んでください</h2>
      <p class="panel__note">料金はすべて税抜表示です。</p>
      <div id="planList"></div>
      <p class="subtotal" id="subtotal-2"></p>
      <div class="btn-row">
        <button class="btn btn--ghost" data-back="1">戻る</button>
      </div>
    </section>

    <!-- STEP 3: 撮影日 -->
    <section class="panel" id="panel-3" hidden>
      <h2 class="panel__title">撮影希望日を選んでください</h2>
      <p class="panel__note">土日・祝日は追加料金の対象です（自動判定されます）。</p>
      <div class="date-field">
        <input type="date" id="dateInput">
        <p class="date-hint" id="dateHint" hidden></p>
      </div>
      <p class="subtotal" id="subtotal-3"></p>
      <div class="btn-row">
        <button class="btn btn--ghost" data-back="2">戻る</button>
        <button class="btn btn--primary" id="toResult" disabled>見積りを見る</button>
      </div>
    </section>

    <!-- STEP 4: 結果 -->
    <section class="panel" id="panel-4" hidden>
      <h2 class="panel__title">お見積り結果</h2>

      <div class="summary" id="summaryBox"></div>

      <div class="price-box">
        <p class="price-box__row" id="priceOriginal"></p>
        <p class="price-box__badge" id="discountLabel"></p>
        <p class="price-box__final" id="priceFinal"></p>
        <p class="price-box__taxline" id="priceTaxIncluded"></p>
        <p class="price-box__tax">※本シミュレーターの金額は概算です。<br>正式なお見積もりはLINE相談にてご案内します。</p>
      </div>

      <p class="savings-box" id="savingsBox"></p>

      <button class="btn btn--line" id="lineBtn">この内容でLINE相談する（10%OFFクーポンをGET）</button>
      <button class="reset-link" id="resetBtn">最初からやり直す</button>
    </section>
  </main>
</div>

<script>
/* ============================================================
   1. 設定エリア（担当者が編集するのはここだけ）
   ============================================================
   価格・ロケ地・LINE ID・記録先アドレスなど、運用中に変更する
   可能性がある値はすべてこのブロックにまとめています。
   ここより下のコード（2以降）は基本的に触る必要はありません。
============================================================ */

/* 1-1. プラン価格（税抜・円）
   2026.7.30改定版。9プランのうち5つ（near1〜far2）は
   「ロケ地の距離ティア」に連動する基本プラン、
   残り4つ（lokesta以降）は場所に関係なく選べる追加プランです。

   finalPrice を指定した場合はその金額をそのまま支払額として使います
   （near1だけ特別価格のため個別指定。他は指定なし＝下のDEFAULT_DISCOUNT_RATEで自動計算）。 */
const PLANS = {
  near1:   { name: "A.ロケーション近距離①", group: "distance", tier: "near1", price: 120000, finalPrice: 99000 },
  near2:   { name: "A.ロケーション近距離②", group: "distance", tier: "near2", price: 135000 },
  mid:     { name: "A.ロケーション中距離",   group: "distance", tier: "mid",   price: 160000 },
  far1:    { name: "A.ロケーション長距離①", group: "distance", tier: "far1",  price: 208000 },
  far2:    { name: "A.ロケーション長距離②", group: "distance", tier: "far2",  price: 218000 },
  lokesta: { name: "ロケスタ",               group: "upgrade", desc: "ロケ+スタジオ",       price: 148000 },
  twoLook: { name: "ロケーション2着",         group: "upgrade", desc: "衣装2着プラン",       price: 198000 },
  oneDay:  { name: "ロケーション1day",        group: "upgrade", desc: "1日満喫コース",       price: 298000 },
  premium: { name: "ロケーションプレミア",     group: "upgrade", desc: "アルバム付き",        price: 480000 },
};

/* 1-2. 標準の割引率（finalPriceを個別指定していないプランに適用） */
const DEFAULT_DISCOUNT_RATE = 0.10; // 10%OFF

/* 1-3. 距離ティアの表示ラベル（ロケ地一覧のバッジ表示に使用） */
const TIER_LABELS = {
  near1: "近距離①", near2: "近距離②", mid: "中距離", far1: "長距離①", far2: "長距離②",
};

/* 1-4. エリアの定義と、エリア内でのロケ地の並び順
   ロケ地を追加・削除するときは、このAREA_DEFと
   下の LOCATION_TIER の【両方】に手を入れてください。
   （片方だけだと画面に出てこなかったり、距離ティアが判定できません） */
const AREA_DEF = {
  "札幌市内": [
    "大通公園", "中島公園", "サッポロファクトリー", "旧永山邸", "北海道庁赤レンガ庁舎", "すすきの",
    "伏見稲荷神社", "天神山緑地", "サッポロビール園", "円山公園",
    "モエレ沼公園", "百合が原公園", "平岡樹芸センター", "幌見峠", "藻岩山",
    "滝野すずらん公園", "札幌芸術の森",
  ],
  "小樽・石狩": [
    "小樽運河＋手宮線 2箇所コース", "あそびーち石狩＋はまなすの丘公園コース",
  ],
  "旭川": [
    "護国神社", "上野ファーム", "旭川駅", "常盤公園",
  ],
  "美瑛・富良野・留萌": [
    "美瑛2箇所コース（青い池・四季彩の丘・ジェットコースターの路・千代田ファーム・拓真館から選択）",
    "上富良野 日の出公園", "上富良野 フラワーランド",
    "鳥沼公園", "留萌ゴールデンビーチ",
  ],
  "帯広・十勝": [
    "真鍋庭園", "真鍋庭園（真正閣）",
    "十勝ヒルズ", "十勝牧場白樺並木",
    "幸福駅",
    "十勝千年の森",
  ],
  "函館": [
    "金森赤レンガ倉庫",
  ],
};

/* 1-4b. エリアごとの取扱店舗（ロケ地一覧の下に補足表示するだけの情報。計算には使わない）
   小樽・石狩／美瑛・富良野・留萌は、それぞれ元の札幌エリア・旭川エリアの取扱店舗を引き継いでいます */
const AREA_STORE = {
  "札幌市内": "取扱店舗：札幌中央店、サッポロファクトリー店",
  "小樽・石狩": "取扱店舗：札幌中央店、サッポロファクトリー店",
  "旭川": "取扱店舗：旭川店",
  "美瑛・富良野・留萌": "取扱店舗：旭川店",
  "帯広・十勝": "取扱店舗：帯広店",
  "函館": "取扱店舗：函館北斗店",
};

/* 1-5. ロケ地マスタ：ロケ地名 → 距離ティア（near1 / near2 / mid / far1 / far2）
   貴社からいただいた実際の対応表（2026.7.30）を反映済みです。
   エリアによっては一部の距離ティアが存在しません
   （例：旭川エリアに近距離①はない／函館エリアは長距離①のみ）。 */
const LOCATION_TIER = {
  // --- 札幌エリア ---
  "大通公園": "near1", "中島公園": "near1", "サッポロファクトリー": "near1",
  "旧永山邸": "near1", "北海道庁赤レンガ庁舎": "near1", "すすきの": "near1",
  "伏見稲荷神社": "near2", "天神山緑地": "near2", "サッポロビール園": "near2", "円山公園": "near2",
  "モエレ沼公園": "mid", "百合が原公園": "mid", "平岡樹芸センター": "mid", "幌見峠": "mid", "藻岩山": "mid",
  "滝野すずらん公園": "far1", "札幌芸術の森": "far1",
  "小樽運河＋手宮線 2箇所コース": "far1", "あそびーち石狩＋はまなすの丘公園コース": "far1",

  // --- 旭川エリア ---
  "護国神社": "near2", "上野ファーム": "near2", "旭川駅": "near2", "常盤公園": "near2",
  "美瑛2箇所コース（青い池・四季彩の丘・ジェットコースターの路・千代田ファーム・拓真館から選択）": "mid",
  "上富良野 日の出公園": "far1", "上富良野 フラワーランド": "far1",
  "鳥沼公園": "far2", "留萌ゴールデンビーチ": "far2",

  // --- 帯広エリア ---
  "真鍋庭園": "near1", "真鍋庭園（真正閣）": "near1",
  "十勝ヒルズ": "near2", "十勝牧場白樺並木": "near2",
  "幸福駅": "mid",
  "十勝千年の森": "far1",

  // --- 函館エリア ---
  "金森赤レンガ倉庫": "far1",
};

/* 1-5. 土日祝の追加料金（税抜・円） */
const HOLIDAY_SURCHARGE = 30000;

/* 1-5b. 消費税率（税込価格の表示に使用。金額はすべて税抜が基準） */
const TAX_RATE = 0.10;

/* 1-6. 割引後の端数処理："round"=四捨五入 / "floor"=切り捨て / "ceil"=切り上げ */
const ROUNDING = "round";

/* 1-7. LINE公式アカウントのID（@は付けない） */
const LINE_ID = "https://page.line.me/823ajfjj?oat_content=url&openQrModal=true";

/* 1-8. GAS（記録係）の公開URL。「別紙：お引っ越し手順」でデプロイ後に書き換える */
const GAS_URL = "https://script.google.com/macros/s/AKfycbz0pNmYDfOeZAlp97FNHLah4VsRsjcU-Xfiam5Pjcw6d_Mb2sRERIUaTlj9mUOtkFoc_w/exec";


/* ============================================================
   2. 祝日の自動判定（土日祝の追加料金に使用）
   固定日・ハッピーマンデー・春分/秋分の日を計算式で求めています。
   春分/秋分は近似計算式のため、年によっては前後1日ずれる可能性が
   あります。毎年2月頃に内閣府の発表と照合してください。
   参考：内閣府「国民の祝日」 https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html
============================================================ */
function nthMonday(year, month, n){
  const first = new Date(year, month - 1, 1);
  const daysUntilMonday = (1 - first.getDay() + 7) % 7; // 1日から最初の月曜日までの日数
  const firstMonday = 1 + daysUntilMonday;
  return firstMonday + (n - 1) * 7;
}
function vernalEquinox(year){
  return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
}
function autumnalEquinox(year){
  return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
}
const _holidayCache = {};
function getHolidaySet(year){
  if (_holidayCache[year]) return _holidayCache[year];
  const list = [];
  const push = (m, d) => list.push(new Date(year, m - 1, d));
  push(1, 1);                          // 元日
  push(2, 11);                         // 建国記念の日
  push(2, 23);                         // 天皇誕生日
  push(4, 29);                         // 昭和の日
  push(5, 3); push(5, 4); push(5, 5);  // 憲法記念日・みどりの日・こどもの日
  push(8, 11);                         // 山の日
  push(11, 3);                         // 文化の日
  push(11, 23);                        // 勤労感謝の日
  push(1, nthMonday(year, 1, 2));      // 成人の日
  push(7, nthMonday(year, 7, 3));      // 海の日
  push(9, nthMonday(year, 9, 3));      // 敬老の日
  push(10, nthMonday(year, 10, 2));    // スポーツの日
  push(3, vernalEquinox(year));        // 春分の日
  push(9, autumnalEquinox(year));      // 秋分の日

  const key = d => d.toISOString().slice(0, 10);
  const set = new Set(list.map(key));
  // 振替休日：日曜と重なった祝日の翌日以降、祝日でない最初の日を休日にする
  list.forEach(d => {
    if (d.getDay() === 0) {
      const next = new Date(d);
      do { next.setDate(next.getDate() + 1); } while (set.has(key(next)));
      set.add(key(next));
    }
  });
  _holidayCache[year] = set;
  return set;
}
function isSurchargeDate(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d.getTime())) return false; // 不正な日付は非対象として扱う
  const day = d.getDay();
  if (day === 0 || day === 6) return true; // 土日
  return getHolidaySet(d.getFullYear()).has(dateStr);
}


/* ============================================================
   3. 状態管理・料金計算
============================================================ */
const state = { location: null, plan: null, date: null, isSurcharge: false };
const openAreas = new Set(); // アコーディオンで開いているエリア名を記録

function round(n){
  if (ROUNDING === "floor") return Math.floor(n);
  if (ROUNDING === "ceil")  return Math.ceil(n);
  return Math.round(n);
}
function yen(n){ return "¥" + n.toLocaleString("ja-JP"); }

// 選んだロケ地の距離ティアに合う「おすすめプラン」のキーを返す
function recommendedPlanKey(){
  const tier = LOCATION_TIER[state.location];
  const entry = Object.entries(PLANS).find(([, p]) => p.group === "distance" && p.tier === tier);
  return entry ? entry[0] : null;
}

// ステップ1〜3の下に出す「ここまでの合計（割引前）」。
// プラン確定前でも、ロケ地から自動判定したおすすめプランの定価を仮表示する。
function currentSubtotal(){
  const key = state.plan || recommendedPlanKey();
  if (!key) return null;
  let total = PLANS[key].price;
  if (state.isSurcharge) total += HOLIDAY_SURCHARGE;
  return total;
}
function renderSubtotal(elId){
  const el = document.getElementById(elId);
  if (!el) return;
  const total = currentSubtotal();
  el.innerHTML = total != null ? `ここまでの合計（割引前）<strong>${yen(total)}</strong>` : "";
}

function calc(){
  const plan = PLANS[state.plan];
  const surcharge = state.isSurcharge ? HOLIDAY_SURCHARGE : 0;

  // 支払額：個別指定（finalPrice）があればそれを使い、なければ標準割引率で計算
  const discountedBase = plan.finalPrice != null
    ? plan.finalPrice
    : round(plan.price * (1 - DEFAULT_DISCOUNT_RATE));

  // 土日祝加算は「割引後」に上乗せする（加算額自体は割引しない）
  const original = plan.price + surcharge;
  const final = discountedBase + surcharge;
  const finalWithTax = round(final * (1 + TAX_RATE));
  const rateApplied = (plan.price - discountedBase) / plan.price;

  return { plan, surcharge, original, final, finalWithTax, rateApplied };
}


/* ============================================================
   4. 画面描画
============================================================ */
function showStep(n){
  for (let i = 1; i <= 4; i++){
    document.getElementById("panel-" + i).hidden = (i !== n);
  }
  document.querySelectorAll("#stepIndicator li").forEach(li => {
    const s = Number(li.dataset.step);
    li.classList.toggle("is-active", s === n);
    li.classList.toggle("is-done", s < n);
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderLocations(){
  const wrap = document.getElementById("locationList");
  wrap.innerHTML = "";
  Object.entries(AREA_DEF).forEach(([area, names]) => {
    const hasSelection = names.includes(state.location);
    const isOpen = hasSelection || openAreas.has(area);

    const box = document.createElement("div");
    box.className = "area" + (isOpen ? " is-open" : "");

    const header = document.createElement("button");
    header.type = "button";
    header.className = "area__header";
    header.innerHTML = `
      <span>${area}<span class="area__store">${AREA_STORE[area] || ""}</span></span>
      <span class="area__header-right">
        ${hasSelection ? `<span class="area__header-selected">${state.location}</span>` : ""}
        <svg class="area__arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </span>`;
    header.addEventListener("click", () => {
      if (openAreas.has(area)) openAreas.delete(area); else openAreas.add(area);
      renderLocations();
    });

    const body = document.createElement("div");
    body.className = "area__body";
    names.forEach(name => {
      const tier = LOCATION_TIER[name];
      const row = document.createElement("button");
      row.type = "button";
      row.className = "loc-row" + (state.location === name ? " is-selected" : "");
      row.innerHTML = `<span>${name}</span><span class="loc-row__badge">${tier ? TIER_LABELS[tier] : "※距離ティア未設定"}</span>`;
      row.addEventListener("click", () => {
        state.location = name;
        state.plan = null; // ロケ地を変えたらプラン選択はやり直し
        renderLocations();
        renderPlans();
        showStep(2);
      });
      body.appendChild(row);
    });

    box.appendChild(header);
    box.appendChild(body);
    wrap.appendChild(box);
  });
  renderSubtotal("subtotal-1");
}

function renderPlans(){
  const wrap = document.getElementById("planList");
  wrap.innerHTML = "";

  const tier = LOCATION_TIER[state.location];
  // 選んだロケ地の距離ティアに一致するプラン1件 ＋ 場所を問わず選べる追加プラン4件だけを表示
  const visibleKeys = Object.entries(PLANS)
    .filter(([, p]) => (p.group === "distance" && p.tier === tier) || p.group === "upgrade")
    .map(([key]) => key);

  visibleKeys.forEach(key => {
    const plan = PLANS[key];
    const discountedBase = plan.finalPrice != null
      ? plan.finalPrice
      : round(plan.price * (1 - DEFAULT_DISCOUNT_RATE));
    const isRecommended = plan.group === "distance";

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "plan-card" + (state.plan === key ? " is-selected" : "");
    btn.innerHTML = `
      <span>
        <span class="plan-card__name">${plan.name}${isRecommended ? '<span class="plan-card__badge">おすすめ</span>' : ""}</span>
        <span class="plan-card__desc">${plan.desc || ""}</span>
      </span>
      <span class="plan-card__price">
        <span class="plan-card__price-original">${yen(plan.price)}</span>
        <span class="plan-card__price-final">${yen(discountedBase)}</span>
      </span>`;
    btn.addEventListener("click", () => {
      state.plan = key;
      renderPlans();
      showStep(3);
    });
    wrap.appendChild(btn);
  });
  renderSubtotal("subtotal-2");
}

function renderSummary(){
  const { plan, original, final, finalWithTax, rateApplied } = calc();
  const tier = LOCATION_TIER[state.location];
  const box = document.getElementById("summaryBox");
  box.innerHTML = `
    <div class="summary-row"><span class="summary-row__label">ロケ地</span><span class="summary-row__value">${state.location}${tier ? "（" + TIER_LABELS[tier] + "）" : ""}</span></div>
    <div class="summary-row"><span class="summary-row__label">プラン</span><span class="summary-row__value">${plan.name}</span></div>
    <div class="summary-row"><span class="summary-row__label">撮影日</span><span class="summary-row__value">${state.date}${state.isSurcharge ? "（土日祝）" : "（平日）"}</span></div>
  `;
  document.getElementById("priceOriginal").innerHTML = `通常価格 <del>${yen(original)}</del>`;
  document.getElementById("discountLabel").textContent = `${Math.round(rateApplied * 1000) / 10}%OFF 適用後`;
  document.getElementById("priceFinal").innerHTML = `${yen(final)}<small>（税抜）</small>`;
  document.getElementById("priceTaxIncluded").textContent = `税込 ${yen(finalWithTax)}`;
  document.getElementById("savingsBox").innerHTML =
    `LINE相談のご利用で<br><strong>${yen(original - final)}</strong> おトクになります`;
}


/* ============================================================
   5. イベント設定
============================================================ */
document.getElementById("dateInput").addEventListener("change", (e) => {
  const val = e.target.value;
  const hint = document.getElementById("dateHint");
  const toResultBtn = document.getElementById("toResult");
  if (!val){ hint.hidden = true; toResultBtn.disabled = true; state.isSurcharge = false; renderSubtotal("subtotal-3"); return; }
  state.date = val;
  state.isSurcharge = isSurchargeDate(val);
  hint.hidden = false;
  toResultBtn.disabled = false;
  hint.textContent = state.isSurcharge
    ? `この日は土日祝のため、${yen(HOLIDAY_SURCHARGE)} が加算されます`
    : "平日のため追加料金はかかりません";
  renderSubtotal("subtotal-3");
});

document.getElementById("toResult").addEventListener("click", () => {
  renderSummary();
  showStep(4);
});

document.querySelectorAll("[data-back]").forEach(btn => {
  btn.addEventListener("click", () => showStep(Number(btn.dataset.back)));
});

document.getElementById("resetBtn").addEventListener("click", () => {
  state.location = state.plan = state.date = null;
  state.isSurcharge = false;
  openAreas.clear();
  document.getElementById("dateInput").value = "";
  document.getElementById("dateHint").hidden = true;
  renderLocations();
  showStep(1);
});

document.getElementById("lineBtn").addEventListener("click", () => {
  const { plan, final } = calc();
  const message =
    `見積もり相談です\n` +
    `ロケ地：${state.location}\n` +
    `プラン：${plan.name}\n` +
    `撮影日：${state.date}\n` +
    `お見積り金額：${yen(final)}（税抜）`;

  // 記録係（GAS）へ送信。失敗してもLINE遷移は必ず行う（結果を待たない）
  try {
    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      keepalive: true,
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        timestamp: new Date().toISOString(),
        location: state.location,
        plan: plan.name,
        date: state.date,
        isSurcharge: state.isSurcharge,
        finalPrice: final,
      }),
    }).catch(() => {});
  } catch (err) { /* 記録に失敗してもお客様には影響させない */ }

  const lineUrl = `https://line.me/R/oaMessage/@${LINE_ID}/?${encodeURIComponent(message)}`;
  window.location.href = lineUrl;
});


/* ============================================================
   6. 初期表示
============================================================ */
renderLocations();
renderPlans();
showStep(1);
</script>
